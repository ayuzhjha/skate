<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="100%" height="100%">
  <defs>
    <linearGradient id="auroraGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e676" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="deckGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b0764" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#7e22ce" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#00e676" stop-opacity="0.4" />
    </linearGradient>
  </defs>

  <!-- Flowing Aurora Smoke Ribbons -->
  <path d="M 120,-20 Q 220,40 180,120 T 320,180" fill="none" stroke="url(#auroraGlow)" stroke-width="45" filter="blur(25px)" />
  <path d="M 180,-10 Q 280,30 240,110 T 350,150" fill="none" stroke="#00e676" stroke-width="20" stroke-opacity="0.18" filter="blur(18px)" />

  <!-- Angled 3D Skateboard Deck Silhouette in top right -->
  <g transform="translate(190, 30) rotate(-32) scale(1.1)" opacity="0.45">
    <!-- Wheels -->
    <ellipse cx="40" cy="55" rx="8" ry="11" fill="#00e676" opacity="0.6" filter="blur(1px)" />
    <ellipse cx="140" cy="55" rx="8" ry="11" fill="#00e676" opacity="0.6" filter="blur(1px)" />
    <!-- Trucks -->
    <line x1="40" y1="50" x2="40" y2="35" stroke="#94a3b8" stroke-width="4" />
    <line x1="140" y1="50" x2="140" y2="35" stroke="#94a3b8" stroke-width="4" />
    <!-- Deck Edge & Surface -->
    <path d="M 0,35 C -15,30 -15,15 5,12 L 35,8 C 50,6 130,6 145,8 L 175,12 C 195,15 195,30 180,35 L 145,38 C 130,40 50,40 35,38 Z" fill="url(#deckGlow)" stroke="#00e676" stroke-width="1" stroke-opacity="0.5" />
    <!-- Graphic Stripe -->
    <path d="M 30,22 L 150,22" stroke="#facc15" stroke-width="3" stroke-opacity="0.4" stroke-dasharray="8 6" />
  </g>
</svg>

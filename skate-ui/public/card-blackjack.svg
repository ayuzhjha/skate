<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%">
  <defs>
    <!-- Felt Table Gradient -->
    <radialGradient id="feltBg" cx="50%" cy="60%" r="70%">
      <stop offset="0%" stop-color="#144d2d" />
      <stop offset="50%" stop-color="#0a2a18" />
      <stop offset="100%" stop-color="#04130b" />
    </radialGradient>
    <linearGradient id="warmLight" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.6" />
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="-2" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.75" />
    </filter>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="85%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
  </defs>

  <!-- Background Felt with rich vignette -->
  <rect width="320" height="180" fill="url(#feltBg)" />
  <rect width="320" height="180" fill="url(#warmLight)" />

  <!-- Soft bokeh / table glow circles -->
  <circle cx="270" cy="40" r="45" fill="#facc15" opacity="0.08" filter="blur(20px)" />
  <circle cx="60" cy="50" r="50" fill="#10b981" opacity="0.12" filter="blur(25px)" />

  <!-- Felt curved marking line -->
  <path d="M -20,150 Q 160,80 340,150" fill="none" stroke="#d4af37" stroke-width="1.5" stroke-opacity="0.25" />

  <!-- Fan of Playing Cards -->
  <g transform="translate(160, 95) scale(0.95)" filter="url(#cardShadow)">
    <!-- Card 1: 7 of Clubs (Back Left) -->
    <g transform="translate(-52, -5) rotate(-22)">
      <rect x="-35" y="-55" width="70" height="105" rx="7" fill="url(#cardGrad)" stroke="#cbd5e1" stroke-width="0.8" />
      <text x="-26" y="-36" font-family="'Inter', sans-serif" font-weight="900" font-size="14" fill="#0f172a">7</text>
      <text x="-26" y="-23" font-size="12" fill="#0f172a">♣</text>
      <text x="0" y="8" font-size="28" fill="#0f172a" text-anchor="middle">♣</text>
    </g>

    <!-- Card 2: Ace of Diamonds (Middle) -->
    <g transform="translate(-16, -14) rotate(-7)">
      <rect x="-35" y="-55" width="70" height="105" rx="7" fill="url(#cardGrad)" stroke="#cbd5e1" stroke-width="0.8" />
      <text x="-26" y="-36" font-family="'Inter', sans-serif" font-weight="900" font-size="14" fill="#dc2626">A</text>
      <text x="-26" y="-23" font-size="12" fill="#dc2626">♦</text>
      <text x="0" y="8" font-size="30" fill="#dc2626" text-anchor="middle">♦</text>
    </g>

    <!-- Card 3: Ace of Spades (Front Right) -->
    <g transform="translate(26, -10) rotate(10)">
      <rect x="-35" y="-55" width="70" height="105" rx="7" fill="url(#cardGrad)" stroke="#cbd5e1" stroke-width="0.8" />
      <text x="-26" y="-36" font-family="'Inter', sans-serif" font-weight="900" font-size="14" fill="#0f172a">A</text>
      <text x="-26" y="-23" font-size="12" fill="#0f172a">♠</text>
      <!-- Big ornate Ace of Spades center -->
      <path d="M 0,-8 C -8,5 -18,12 -12,22 C -8,28 -1,25 0,21 C 1,25 8,28 12,22 C 18,12 8,5 0,-8 Z" fill="#0f172a" />
      <path d="M 0,16 L -5,25 L 5,25 Z" fill="#0f172a" />
    </g>
  </g>
  
  <!-- Subtle dark overlay on bottom for text readability -->
  <linearGradient id="bottomFade" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#000000" stop-opacity="0" />
    <stop offset="60%" stop-color="#000000" stop-opacity="0.4" />
    <stop offset="100%" stop-color="#050d08" stop-opacity="0.9" />
  </linearGradient>
  <rect y="70" width="320" height="110" fill="url(#bottomFade)" />
</svg>

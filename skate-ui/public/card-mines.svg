<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="minesBg" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#0e2820" />
      <stop offset="60%" stop-color="#081712" />
      <stop offset="100%" stop-color="#040b08" />
    </radialGradient>
    <filter id="diamondGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#38bdf8" flood-opacity="0.8" />
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.9" />
    </filter>
    <linearGradient id="facetTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#7dd3fc" />
    </linearGradient>
    <linearGradient id="facetL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="facetR" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="facetB" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#075985" />
    </linearGradient>
    <linearGradient id="tileGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="320" height="180" fill="url(#minesBg)" />

  <!-- Neon Ambient Glow -->
  <circle cx="160" cy="70" r="75" fill="#38bdf8" opacity="0.22" filter="blur(30px)" />
  <circle cx="160" cy="70" r="95" fill="#00e676" opacity="0.08" filter="blur(35px)" />

  <!-- Perspective 5x5 Grid Tiles in dark slate -->
  <g transform="translate(160, 110) scale(1, 0.45) rotate(45) translate(-100, -100)" opacity="0.75">
    <!-- Grid Cells -->
    <rect x="20" y="20" width="30" height="30" rx="4" fill="url(#tileGrad)" stroke="#334155" stroke-width="1.5" />
    <rect x="55" y="20" width="30" height="30" rx="4" fill="url(#tileGrad)" stroke="#334155" stroke-width="1.5" />
    <rect x="90" y="20" width="30" height="30" rx="4" fill="url(#tileGrad)" stroke="#334155" stroke-width="1.5" />
    <rect x="125" y="20" width="30" height="30" rx="4" fill="url(#tileGrad)" stroke="#334155" stroke-width="1.5" />

    <rect x="20" y="55" width="30" height="30" rx="4" fill="url(#tileGrad)" stroke="#334155" stroke-width="1.5" />
    <rect x="55" y="55" width="30" height="30" rx="4" fill="url(#tileGrad)" stroke="#38bdf8" stroke-width="2" />
    <rect x="90" y="55" width="30" height="30" rx="4" fill="url(#tileGrad)" stroke="#334155" stroke-width="1.5" />
    <rect x="125" y="55" width="30" height="30" rx="4" fill="url(#tileGrad)" stroke="#334155" stroke-width="1.5" />

    <rect x="20" y="90" width="30" height="30" rx="4" fill="url(#tileGrad)" stroke="#334155" stroke-width="1.5" />
    <rect x="55" y="90" width="30" height="30" rx="4" fill="url(#tileGrad)" stroke="#334155" stroke-width="1.5" />
    <rect x="90" y="90" width="30" height="30" rx="4" fill="url(#tileGrad)" stroke="#334155" stroke-width="1.5" />
    <rect x="125" y="90" width="30" height="30" rx="4" fill="url(#tileGrad)" stroke="#334155" stroke-width="1.5" />
  </g>

  <!-- Glowing 3D Crystal Diamond Floating in Center -->
  <g transform="translate(160, 65) scale(1.15)" filter="url(#diamondGlow)">
    <!-- Top Table / Flat Crown -->
    <polygon points="-22,-14 22,-14 14,-22 -14,-22" fill="url(#facetTop)" stroke="#e0f2fe" stroke-width="0.8" />
    <!-- Upper Side Facets -->
    <polygon points="-22,-14 -14,-22 -36,-6" fill="url(#facetL)" stroke="#7dd3fc" stroke-width="0.5" />
    <polygon points="22,-14 14,-22 36,-6" fill="url(#facetR)" stroke="#7dd3fc" stroke-width="0.5" />
    <polygon points="-22,-14 0,-6 -36,-6" fill="url(#facetL)" stroke="#7dd3fc" stroke-width="0.5" />
    <polygon points="22,-14 0,-6 36,-6" fill="url(#facetR)" stroke="#7dd3fc" stroke-width="0.5" />
    <polygon points="-22,-14 0,-6 22,-14" fill="url(#facetTop)" stroke="#7dd3fc" stroke-width="0.5" />
    
    <!-- Pavilion / Lower Facets to Point -->
    <polygon points="-36,-6 0,-6 0,26" fill="url(#facetL)" stroke="#38bdf8" stroke-width="0.6" />
    <polygon points="36,-6 0,-6 0,26" fill="url(#facetR)" stroke="#38bdf8" stroke-width="0.6" />
    <polygon points="-36,-6 0,26 -20,2" fill="url(#facetB)" opacity="0.8" />
    <polygon points="36,-6 0,26 20,2" fill="url(#facetB)" opacity="0.8" />

    <!-- Sparkle Stars -->
    <polygon points="18,-18 21,-14 26,-14 22,-11 24,-6 18,-9 13,-6 15,-11 11,-14 16,-14" fill="#ffffff" opacity="0.9" transform="scale(0.5) translate(25,-25)" />
  </g>

  <!-- Bottom Dark Gradient for clean text display -->
  <linearGradient id="bottomFadeM" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#000000" stop-opacity="0" />
    <stop offset="60%" stop-color="#000000" stop-opacity="0.4" />
    <stop offset="100%" stop-color="#040b08" stop-opacity="0.9" />
  </linearGradient>
  <rect y="70" width="320" height="110" fill="url(#bottomFadeM)" />
</svg>

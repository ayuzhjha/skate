<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <radialGradient id="avatarBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#182c22" />
      <stop offset="70%" stop-color="#0c1712" />
      <stop offset="100%" stop-color="#070d0a" />
    </radialGradient>
    <linearGradient id="deckGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333ea" />
      <stop offset="30%" stop-color="#7e22ce" />
      <stop offset="70%" stop-color="#581c87" />
      <stop offset="100%" stop-color="#3b0764" />
    </linearGradient>
    <linearGradient id="deckEdge" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#2e1065" />
    </linearGradient>
    <radialGradient id="wheelGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#facc15" />
      <stop offset="90%" stop-color="#ca8a04" />
      <stop offset="100%" stop-color="#854d0e" />
    </radialGradient>
    <radialGradient id="wheelCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="60%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#475569" />
    </radialGradient>
    <linearGradient id="truckGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="50%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>
    <filter id="skateShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.8" />
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#00e676" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- Circular background -->
  <circle cx="60" cy="60" r="58" fill="url(#avatarBg)" />
  
  <!-- Subtle circular grid / ring -->
  <circle cx="60" cy="60" r="54" fill="none" stroke="#00e676" stroke-width="1" stroke-opacity="0.25" stroke-dasharray="2 3" />
  <ellipse cx="60" cy="92" rx="36" ry="12" fill="#000000" opacity="0.6" filter="blur(4px)" />

  <!-- Skateboard Group rotated 36 deg -->
  <g transform="translate(60,60) rotate(-38) scale(0.92) translate(-60,-60)" filter="url(#skateShadow)">
    <!-- Back wheels shadow -->
    <ellipse cx="38" cy="68" rx="8" ry="6" fill="#000000" opacity="0.5" />
    <ellipse cx="82" cy="68" rx="8" ry="6" fill="#000000" opacity="0.5" />

    <!-- Trucks / Baseplates -->
    <rect x="34" y="58" width="12" height="6" rx="2" fill="url(#truckGrad)" />
    <rect x="74" y="58" width="12" height="6" rx="2" fill="url(#truckGrad)" />
    <line x1="26" y1="62" x2="54" y2="62" stroke="url(#truckGrad)" stroke-width="3.5" stroke-linecap="round" />
    <line x1="66" y1="62" x2="94" y2="62" stroke="url(#truckGrad)" stroke-width="3.5" stroke-linecap="round" />

    <!-- 4 Wheels -->
    <!-- Rear-left wheel -->
    <ellipse cx="26" cy="63" rx="6" ry="8" fill="url(#wheelGrad)" />
    <ellipse cx="26" cy="63" rx="2.5" ry="3.5" fill="url(#wheelCore)" />
    <!-- Rear-right wheel -->
    <ellipse cx="54" cy="61" rx="6" ry="8" fill="url(#wheelGrad)" />
    <ellipse cx="54" cy="61" rx="2.5" ry="3.5" fill="url(#wheelCore)" />
    <!-- Front-left wheel -->
    <ellipse cx="66" cy="63" rx="6" ry="8" fill="url(#wheelGrad)" />
    <ellipse cx="66" cy="63" rx="2.5" ry="3.5" fill="url(#wheelCore)" />
    <!-- Front-right wheel -->
    <ellipse cx="94" cy="61" rx="6" ry="8" fill="url(#wheelGrad)" />
    <ellipse cx="94" cy="61" rx="2.5" ry="3.5" fill="url(#wheelCore)" />

    <!-- Skateboard Deck Bottom Layer (Wood Edge) -->
    <path d="M 14,49 C 10,48 10,43 16,42 L 28,40 C 35,39 85,39 92,40 L 104,42 C 110,43 110,48 106,49 L 94,51 C 86,52 34,52 26,51 Z" fill="url(#deckEdge)" />

    <!-- Skateboard Deck Top Surface -->
    <path d="M 15,47 C 11,46 12,41 17,40 L 29,38 C 36,37 84,37 91,38 L 103,40 C 108,41 109,46 105,47 L 93,49 C 85,50 35,50 27,49 Z" fill="url(#deckGrad)" />

    <!-- Grip tape / graphic pattern -->
    <path d="M 32,42 C 45,41 75,41 88,42 L 86,45 C 73,44 47,44 34,45 Z" fill="#c084fc" opacity="0.4" />
    
    <!-- Bolts -->
    <circle cx="36" cy="43.5" r="1" fill="#f8fafc" opacity="0.8" />
    <circle cx="40" cy="43.5" r="1" fill="#f8fafc" opacity="0.8" />
    <circle cx="80" cy="43.5" r="1" fill="#f8fafc" opacity="0.8" />
    <circle cx="84" cy="43.5" r="1" fill="#f8fafc" opacity="0.8" />

    <!-- Deck Specular Shine -->
    <path d="M 22,40 C 35,38 85,38 98,40" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity="0.4" />
  </g>
</svg>

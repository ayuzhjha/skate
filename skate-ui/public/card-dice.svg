<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="diceBg" cx="70%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#2a103c" />
      <stop offset="50%" stop-color="#150821" />
      <stop offset="100%" stop-color="#07030d" />
    </radialGradient>
    <filter id="diceShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="-2" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.85" />
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#a855f7" flood-opacity="0.45" />
    </filter>
    <linearGradient id="purpleDieTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e9d5ff" />
      <stop offset="70%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="purpleDieLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#7e22ce" />
    </linearGradient>
    <linearGradient id="purpleDieRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333ea" />
      <stop offset="100%" stop-color="#581c87" />
    </linearGradient>
    <linearGradient id="blackDieTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="blackDieLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="blackDieRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="320" height="180" fill="url(#diceBg)" />

  <!-- Neon Ambient Purple Lighting & Motion Streak -->
  <circle cx="230" cy="70" r="85" fill="#a855f7" opacity="0.25" filter="blur(35px)" />
  <circle cx="120" cy="95" r="70" fill="#7e22ce" opacity="0.15" filter="blur(30px)" />
  
  <!-- Light streak / motion trails -->
  <path d="M 80,120 Q 180,60 260,70" fill="none" stroke="#d8b4fe" stroke-width="2" opacity="0.25" filter="blur(2px)" />

  <!-- Die 1: Obsidian Black Die (Left Front) -->
  <g transform="translate(135, 100) scale(0.95)" filter="url(#diceShadow)">
    <!-- Top Face (Skewed Rhombus) -->
    <polygon points="0,-42 36,-24 0,-6 -36,-24" fill="url(#blackDieTop)" stroke="#64748b" stroke-width="0.8" />
    <!-- Left Face -->
    <polygon points="-36,-24 0,-6 0,36 -36,18" fill="url(#blackDieLeft)" stroke="#334155" stroke-width="0.8" />
    <!-- Right Face -->
    <polygon points="0,-6 36,-24 36,18 0,36" fill="url(#blackDieRight)" stroke="#334155" stroke-width="0.8" />
    <!-- Top Face Pips (Number 3) -->
    <ellipse cx="0" cy="-24" rx="3.5" ry="2.2" fill="#f8fafc" />
    <ellipse cx="-18" cy="-33" rx="3" ry="1.8" fill="#f8fafc" />
    <ellipse cx="18" cy="-15" rx="3" ry="1.8" fill="#f8fafc" />
    <!-- Left Face Pips (Number 5) -->
    <circle cx="-18" cy="15" r="3" fill="#f8fafc" />
    <circle cx="-27" cy="3" r="2.8" fill="#f8fafc" />
    <circle cx="-9" cy="27" r="2.8" fill="#f8fafc" />
    <circle cx="-9" cy="3" r="2.8" fill="#f8fafc" />
    <circle cx="-27" cy="27" r="2.8" fill="#f8fafc" />
  </g>

  <!-- Die 2: Glowing Purple Die (Right Back, Tilted) -->
  <g transform="translate(225, 68) rotate(18) scale(0.85)" filter="url(#diceShadow)">
    <!-- Top Face -->
    <polygon points="0,-42 36,-24 0,-6 -36,-24" fill="url(#purpleDieTop)" stroke="#f3e8ff" stroke-width="1" />
    <!-- Left Face -->
    <polygon points="-36,-24 0,-6 0,36 -36,18" fill="url(#purpleDieLeft)" stroke="#c084fc" stroke-width="0.8" />
    <!-- Right Face -->
    <polygon points="0,-6 36,-24 36,18 0,36" fill="url(#purpleDieRight)" stroke="#9333ea" stroke-width="0.8" />
    <!-- Center pip on top -->
    <ellipse cx="0" cy="-24" rx="4.5" ry="3" fill="#ffffff" />
    <!-- Left face pips (Number 4) -->
    <circle cx="-24" cy="5" r="3.2" fill="#ffffff" />
    <circle cx="-10" cy="5" r="3.2" fill="#ffffff" />
    <circle cx="-24" cy="24" r="3.2" fill="#ffffff" />
    <circle cx="-10" cy="24" r="3.2" fill="#ffffff" />
    <!-- Right face pips -->
    <circle cx="12" cy="6" r="3.2" fill="#ffffff" />
    <circle cx="26" cy="24" r="3.2" fill="#ffffff" />
  </g>

  <!-- Bottom Dark Gradient for clean text display -->
  <linearGradient id="bottomFadeD" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#000000" stop-opacity="0" />
    <stop offset="60%" stop-color="#000000" stop-opacity="0.4" />
    <stop offset="100%" stop-color="#07030d" stop-opacity="0.9" />
  </linearGradient>
  <rect y="70" width="320" height="110" fill="url(#bottomFadeD)" />
</svg>
